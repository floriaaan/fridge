generate_recipes:
  description: Generates new recipes based on the products in your fridge.
  fields:
    cuisine:
      description: Type of cuisine (e.g., Italian, French, Asian, Mexican)
      example: "Italian"
      required: false
      selector:
        text:
    difficulty:
      description: Recipe difficulty level
      example: "easy"
      required: false
      selector:
        select:
          options:
            - "easy"
            - "medium"
            - "hard"
    max_time:
      description: Maximum preparation time in minutes
      example: 60
      required: false
      selector:
        number:
          min: 15
          max: 180
          step: 15
          unit_of_measurement: "minutes"
    servings:
      description: Number of servings
      example: 4
      required: false
      selector:
        number:
          min: 1
          max: 12
          step: 1
